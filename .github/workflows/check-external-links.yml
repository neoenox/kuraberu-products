name: external link reachability

on:
  schedule:
    - cron: "23 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # releases/v7.0.1
        with:
          persist-credentials: false
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # releases/v7.0.0
        with:
          node-version-file: .node-version
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build deterministic preview output
        env:
          DEPLOYMENT_ENV: preview
        run: pnpm build
      - name: Restore external link state
        id: restore-state
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node scripts/check-external-link-reachability.mjs --restore-state
      - name: Check external link reachability
        id: reachability
        run: pnpm check:external-link-reachability
      - name: Preserve external link state
        if: ${{ !cancelled() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.restore-state.outcome == 'success' && (steps.reachability.outcome == 'success' || steps.reachability.outcome == 'failure') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: external-link-state
          path: data/external-link-state.json
          retention-days: 90
          if-no-files-found: error
          overwrite: true
