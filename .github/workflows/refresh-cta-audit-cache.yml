name: refresh CTA audit cache

on:
  schedule:
    # Weekly on Monday at 02:23 UTC (offset from external-links which runs at 00:23)
    - cron: "23 2 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # releases/v7.0.1
        with:
          # 短命の job token のみを使い、git push ステップでも明示的に
          # GITHUB_TOKEN を渡す (#559)。persist-credentials: true は
          # checkout 後もトークンが残り続けるため、CIのcredential hygiene
          # として false に統一する。
          persist-credentials: false
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # releases/v7.0.0
        with:
          node-version-file: .node-version
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: PROBE (temporary diagnostics)
        continue-on-error: true
        run: |
          U=https://item.rakuten.co.jp/babybjorn/baby-carrier-harmony/
          for ua in "node" "curl/8.5.0" "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"; do
            for m in "-I" ""; do
              echo "UA=[$ua] mode=[$m]"
              curl -sS $m -o /dev/null -m 15 -A "$ua" -w "  code=%{http_code} t=%{time_total} ip=%{remote_ip}
" "$U" || echo "  curl exit $?"
            done
          done
          echo "UA=[node] with Accept-Language"
          curl -sS -o /dev/null -m 15 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36" -H "Accept-Language: ja-JP,ja;q=0.9" -H "Accept: text/html,application/xhtml+xml" -w "  code=%{http_code} t=%{time_total}
" "$U" || echo "  curl exit $?"
          echo "affiliate hop:"
          curl -sS -I -o /dev/null -m 15 -w "  code=%{http_code} t=%{time_total}
" "https://hb.afl.rakuten.co.jp/ichiba/56e37453.8885bd8a.56e37454.e8853422/?pc=https%3A%2F%2Fitem.rakuten.co.jp%2Fbabybjorn%2Fbaby-carrier-harmony%2F&link_type=text" || echo "  curl exit $?"
      - name: Generate CTA audit cache (strict, no network skip)
        run: node scripts/generate-cta-audit-cache.mjs
      - name: Commit updated cache if changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git diff --quiet data/cta-audit-cache.json && echo "No changes to cache" && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cta-audit-cache.json
          git commit -m "chore: refresh CTA audit cache [skip ci]

          Generated by weekly scheduled workflow.
          This cache is consumed by verify:lint (ALLOW_NETWORK_SKIP=1)
          to prove CTA destination coverage when network calls are skipped."
          # persist-credentials: false のため、ここでトークンを再設定して push。
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
