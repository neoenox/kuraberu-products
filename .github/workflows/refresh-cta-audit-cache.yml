name: refresh CTA audit cache

on:
  schedule:
    # Mondays and Thursdays at 02:23 UTC (offset from external-links which runs at 00:23).
    # Twice a week so one failed run does not let the 7-day cache expire (#973).
    - cron: "23 2 * * 1,4"
  workflow_dispatch:

# main はrulesetで直接pushできないため、更新したキャッシュは専用branchへpushし、
# PRとして出す（#1003）。GITHUB_TOKEN で作ったPRには pull_request イベントが
# 発火しないので、必須チェック "verify" は workflow_dispatch で起動する。
permissions:
  contents: write # 専用branchへのpush
  pull-requests: write # PRの作成と、置き換えた古いPRのクローズ
  actions: write # verify.yml の workflow_dispatch

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      branch: ${{ steps.pr.outputs.branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # releases/v7.0.1
        with:
          # 短命の job token のみを使い、git push ステップでも明示的に
          # GITHUB_TOKEN を渡す (#559)。persist-credentials: true は
          # checkout 後もトークンが残り続けるため、CIのcredential hygiene
          # として false に統一する。
          persist-credentials: false
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # releases/v7.0.0
        with:
          node-version-file: .node-version
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate CTA audit cache (strict, no network skip)
        run: node scripts/generate-cta-audit-cache.mjs
      - name: Open a pull request with the updated cache
        id: pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASE_BRANCH: ${{ github.ref_name }}
          BRANCH: ci/refresh-cta-audit-cache-${{ github.run_id }}
        run: |
          git diff --quiet data/cta-audit-cache.json && echo "No changes to cache" && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add data/cta-audit-cache.json
          git commit -m "chore: refresh CTA audit cache

          Generated by the scheduled refresh-cta-audit-cache workflow.
          This cache is consumed by verify:lint (ALLOW_NETWORK_SKIP=1)
          to prove CTA destination coverage when network calls are skipped."
          # persist-credentials: false のため、ここでトークンを再設定して push。
          # run ごとに新しいbranchを作るため force push は不要。
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${BRANCH}"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"

          BODY="週次ジョブ \`refresh CTA audit cache\` が \`data/cta-audit-cache.json\` を再生成しました。

          - 実行: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - キャッシュは生成から7日で失効し、失効すると全 PR の \`lint-and-test\` が失敗します。必須チェックの通過後にマージしてください。
          - 必須チェック \`verify\` はこのジョブが workflow_dispatch で起動します。
          - 関連: #973, #1003"
          URL=$(gh pr create --base "$BASE_BRANCH" --head "$BRANCH" \
            --title "chore: refresh CTA audit cache" --body "$BODY")
          NUM="${URL##*/}"
          echo "PRを作成しました: ${URL}"

          # GITHUB_TOKEN で作ったPRには pull_request イベントが発火しないため、
          # 同じ head commit で verify を起動し、必須チェックを満たす。
          gh workflow run verify.yml --ref "$BRANCH"

          # 未マージのまま残った以前のキャッシュ更新PRは、新しいPRで置き換わるので閉じる。
          gh pr list --state open --base "$BASE_BRANCH" --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("ci/refresh-cta-audit-cache-")) | select(.headRefName != env.BRANCH) | .number' |
            while read -r OLD; do
              gh pr close "$OLD" --delete-branch --comment "新しいキャッシュ更新PR #${NUM} に置き換えたためクローズします。"
            done

  # 失敗・キャンセル（job timeout を含む）を issue で通知し、次回成功時に自動クローズする。
  # このキャッシュは7日で失効し、失効すると全 PR の lint-and-test が失敗する（#973）。
  # schedule 実行だけを対象にし、手動実行（workflow_dispatch）では起票しない。
  report:
    needs: refresh
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      REFRESH_RESULT: ${{ needs.refresh.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      BRANCH: ${{ needs.refresh.outputs.branch }}
    steps:
      - name: Open or update failure issue
        if: needs.refresh.result != 'success'
        run: |
          TITLE="CTA監査キャッシュの週次更新ジョブが失敗しています"
          BODY="週次ジョブ \`refresh CTA audit cache\` が成功しませんでした（結果: ${REFRESH_RESULT}）。

          - 実行: ${RUN_URL}
          - 影響: \`data/cta-audit-cache.json\` は生成から7日で失効し、失効すると全 PR の \`lint-and-test\`（\`check-purchase-link-consistency\`）が失敗します。
          - 対応: 実行ログを確認し、原因を直してください。急ぐ場合はローカルで \`pnpm verify:cta-strict\` を実行し、\`data/cta-audit-cache.json\` だけを更新する PR を出せます。
          - 関連: #973
          ${BRANCH:+- 更新済みキャッシュはbranch \`${BRANCH}\` にpush済みです。PR作成で失敗した場合は ${GITHUB_SERVER_URL}/${GH_REPO}/compare/main...${BRANCH} から手動でPRを作れます。}

          このジョブが次に成功すると、この issue は自動でクローズされます。"
          NUM=$(gh issue list --state open --search "in:title CTA監査キャッシュの週次更新ジョブが失敗" --json number --jq '.[0].number // empty')
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "再び失敗しました（結果: ${REFRESH_RESULT}）: ${RUN_URL}${BRANCH:+（更新済みキャッシュ: ${GITHUB_SERVER_URL}/${GH_REPO}/compare/main...${BRANCH}）}"
            echo "既存の issue #$NUM にコメントしました"
          else
            gh issue create --title "$TITLE" --body "$BODY"
            echo "失敗通知の issue を新規作成しました"
          fi
      - name: Close failure issue after a successful run
        if: needs.refresh.result == 'success'
        run: |
          NUM=$(gh issue list --state open --search "in:title CTA監査キャッシュの週次更新ジョブが失敗" --json number --jq '.[0].number // empty')
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "週次ジョブが成功したため、この issue をクローズします: ${RUN_URL}"
            gh issue close "$NUM"
            echo "失敗通知の issue #$NUM をクローズしました"
          else
            echo "開いている失敗通知の issue はありません（クローズ不要）"
          fi
