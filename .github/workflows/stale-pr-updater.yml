name: Stale PR updater

# main に behind した PR を毎日読み取り専用で報告する。
# PR ブランチの自動更新（merge/rebase/push）とコメント投稿は禁止。
# --apply はこの workflow では使用しない（別途個別承認が必要）。
#
# 詳細ロジックは scripts/update-stale-prs.mjs を参照（テスト:
# tests/update-stale-prs.test.ts）。

on:
  schedule:
    # 毎日 03:20 UTC（日本時間 12:20）。ピーク時間帯を避け、
    # deploy-production（03:20 台は走らない）と干渉しない時刻。
    - cron: "20 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: stale-pr-updater
  cancel-in-progress: false

jobs:
  update-stale-prs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # releases/v7.0.1
        with:
          persist-credentials: false
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # releases/v7.1.0
        with:
          node-version-file: .node-version
      - name: Report stale PR candidates (read-only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/update-stale-prs.mjs --dry-run
