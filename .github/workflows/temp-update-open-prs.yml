name: temporary inspect merge conflicts
on:
  push:
    branches:
      - "article/next-product"
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d342e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Inspect merge conflicts
        shell: bash
        run: |
          set -u
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          for item in "895:article/next-product" "896:article/next-product-3" "898:article/next-product-5"; do
            pr="${item%%:*}"
            branch_name="${item#*:}"
            echo "=== PR #$pr ($branch_name) ==="
            git checkout -B "inspect-$pr" "origin/$branch_name"
            if git merge --no-commit --no-ff origin/main; then
              echo "NO_CONFLICT"
            else
              echo "CONFLICT_FILES"
              git diff --name-only --diff-filter=U
            fi
            git merge --abort 2>/dev/null || true
          done
