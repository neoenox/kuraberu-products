name: temporary update article PR branches
on:
  push:
    branches:
      - "article/next-product"
permissions:
  contents: write
  pull-requests: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Update PR branches with main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          for pr in 895 896 898; do
            echo "=== updating PR #$pr ==="
            gh pr update-branch "$pr" --repo "$GH_REPO"
          done
