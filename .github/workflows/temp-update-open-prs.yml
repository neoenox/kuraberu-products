name: temporary resolve article branch conflicts
on:
  push:
    branches:
      - "article/next-product"
permissions:
  contents: write
jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Resolve conflicts against main and push
        shell: bash
        run: |
          set -euo pipefail
          if git log -1 --pretty=%B | grep -q '^ci: resolve article branch conflicts with main          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main article/next-product article/next-product-3 article/next-product-5

          resolve_branch() {
            pr="$1"
            target="$2"
            import_line="$3"
            entry_line="$4"
            module_anchor='import { logicoolPebbleM350sVsM650Seed } from "./logicool-pebble-m350s-vs-m650";'
            entry_anchor='  logicoolPebbleM350sVsM650Seed,'

            git checkout -B "resolve-$pr" "origin/$target"
            set +e
            git merge --no-ff origin/main -m "Merge main into $target"
            merge_status=$?
            set -e

            if [ "$merge_status" -ne 0 ]; then
              conflicts="$(git diff --name-only --diff-filter=U)"
              echo "PR #$pr conflicts:"
              printf '%s\n' "$conflicts"

              while IFS= read -r file; do
                [ -z "$file" ] && continue
                case "$file" in
                  src/content/articles/commercial/seeds.ts)
                    git checkout --theirs -- "$file"
                    ;;
                  scripts/check-commercial-article-quality.mjs)
                    if [ "$pr" != "895" ]; then
                      echo "Unexpected quality-script conflict for PR #$pr" >&2
                      exit 1
                    fi
                    git checkout --theirs -- "$file"
                    ;;
                  *)
                    echo "Unexpected conflict for PR #$pr: $file" >&2
                    exit 1
                    ;;
                esac
              done <<< "$conflicts"

              IMPORT_LINE="$import_line" ENTRY_LINE="$entry_line" MODULE_ANCHOR="$module_anchor" ENTRY_ANCHOR="$entry_anchor" PR_NUM="$pr" python3 - <<'PY'
import os
from pathlib import Path

seeds = Path("src/content/articles/commercial/seeds.ts")
text = seeds.read_text()
imp = os.environ["IMPORT_LINE"]
entry = os.environ["ENTRY_LINE"]
module_anchor = os.environ["MODULE_ANCHOR"]
entry_anchor = os.environ["ENTRY_ANCHOR"]
if imp not in text:
    if module_anchor not in text:
        raise SystemExit("seed import anchor missing")
    text = text.replace(module_anchor, imp + "\n" + module_anchor, 1)
if entry not in text:
    if entry_anchor not in text:
        raise SystemExit("seed entry anchor missing")
    text = text.replace(entry_anchor, entry + "\n" + entry_anchor, 1)
seeds.write_text(text)

if os.environ["PR_NUM"] == "895":
    quality = Path("scripts/check-commercial-article-quality.mjs")
    q = quality.read_text()
    old = """    if (!fs.existsSync(path.join(root, "public", image.slice(1)))) {
      errors.push(`${articleId}: image file is missing: ${image}`);
    }"""
    new = """    const imageExists =
      fs.existsSync(path.join(root, "public", image.slice(1))) ||
      fs.existsSync(path.join(root, "src", "assets", image.slice(1)));
    if (!imageExists) {
      errors.push(`${articleId}: image file is missing: ${image}`);
    }"""
    if "const imageExists =" not in q:
        if old not in q:
            raise SystemExit("quality image check anchor missing")
        q = q.replace(old, new, 1)
        quality.write_text(q)
PY
              git add src/content/articles/commercial/seeds.ts
              if [ "$pr" = "895" ]; then
                git add scripts/check-commercial-article-quality.mjs
              fi
              git commit -m "ci: resolve article branch conflicts with main"
            fi

            git push origin "HEAD:$target"
          }

          resolve_branch 895 article/next-product \
            'import { logicoolProXSuperlight2DexVsSuperlight2Seed } from "./logicool-pro-x-superlight-2-dex-vs-superlight-2";' \
            '  logicoolProXSuperlight2DexVsSuperlight2Seed,'

          resolve_branch 896 article/next-product-3 \
            'import { sonyWfC710nVsLinkbudsFitSeed } from "./sony-wf-c710n-vs-linkbuds-fit";' \
            '  sonyWfC710nVsLinkbudsFitSeed,'

          resolve_branch 898 article/next-product-5 \
            'import { garminForerunner570VsCorosPace4Seed } from "./garmin-forerunner-570-vs-coros-pace-4";' \
            '  garminForerunner570VsCorosPace4Seed,'
; then
