name: temporary update open PR branches
on:
  push:
    branches:
      - "article/next-product"
permissions:
  contents: write
  pull-requests: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Update stale PR branches with main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set +e
          for pr in 885 895 896 898; do
            echo "=== updating PR #$pr ==="
            gh pr update-branch "$pr" --repo "$GH_REPO"
            echo "status=$?"
          done
