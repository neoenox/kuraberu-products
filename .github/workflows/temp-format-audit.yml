name: temporary format CTA audit
on:
  push:
    branches:
      - "article/tp-link-be550-vs-be450"
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Format and commit
        shell: bash
        run: |
          pnpm exec prettier --write scripts/check-purchase-link-consistency.mjs
          if git diff --quiet -- scripts/check-purchase-link-consistency.mjs; then
            echo "Already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/check-purchase-link-consistency.mjs
          git commit -m "style: format concurrent CTA audit"
          git push origin "HEAD:${GITHUB_REF_NAME}"
